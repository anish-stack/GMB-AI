<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F53236" />
<title>You're offline</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7fb; --fg:#18181b; --muted:#71717a; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0c0f; --fg:#f4f4f5; --muted:#a1a1aa; --card:#18181b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; box-sizing:border-box; }
  .card { max-width:380px; text-align:center; background:var(--card); border-radius:24px; padding:36px 28px; box-shadow:0 10px 40px rgba(0,0,0,.08); }
  .logo { width:64px; height:64px; border-radius:18px; margin:0 auto 18px; display:block; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 22px; }
  button { background:#F53236; color:#fff; border:0; border-radius:12px; padding:12px 22px; font-weight:600; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Check your internet connection. Your work is saved - you can continue as soon as you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
